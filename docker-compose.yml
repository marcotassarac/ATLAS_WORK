services:
  atlas-postgres:
    image: postgres:15-alpine
    container_name: atlas-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env (ver .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
      PGDATA: /var/lib/postgresql/data/pgdata
    # DEF-19: la base solo se publica en la interfaz local del equipo (herramientas de
    # administración). Antes escuchaba en todas las interfaces (0.0.0.0).
    ports:
      - "127.0.0.1:${PORT_POSTGRES:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./BACKEND/sql/dump-atlas.sql:/tmp/dump-atlas.sql:ro
      - ./BACKEND/sql/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-atlas}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - atlas-network
    restart: unless-stopped

  # DEF-19: las migraciones se aplican con la cuenta de administración de la base en un
  # servicio que termina al completar; la API usa una cuenta sin privilegios de DDL.
  atlas-migraciones:
    image: atlas-atlas-backend
    pull_policy: never
    container_name: atlas-migraciones
    command: ["node", "src/migraciones.js"]
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}@atlas-postgres:5432/${POSTGRES_DB:-atlas}
      - APP_DB_USER=${APP_DB_USER:-atlas_app}
      - APP_DB_PASSWORD=${APP_DB_PASSWORD:?Defina APP_DB_PASSWORD en .env (ver .env.example)}
      - JWT_SECRET=${JWT_SECRET:?Defina JWT_SECRET en .env (ver .env.example)}
      - DATA_ENCRYPTION_KEY=${DATA_ENCRYPTION_KEY:?Defina DATA_ENCRYPTION_KEY en .env (ver .env.example)}
    depends_on:
      atlas-postgres:
        condition: service_healthy
    networks:
      - atlas-network
    restart: "no"

  atlas-backend:
    build:
      context: ./BACKEND
      dockerfile: Dockerfile
    image: atlas-atlas-backend
    container_name: atlas-backend
    hostname: atlas-api
    environment:
      - PORT=4000
      # DEF-19: cuenta de base con permisos mínimos (sin superusuario ni DDL)
      - DATABASE_URL=postgres://${APP_DB_USER:-atlas_app}:${APP_DB_PASSWORD:?Defina APP_DB_PASSWORD}@atlas-postgres:5432/${POSTGRES_DB:-atlas}
      - MIGRAR_AL_INICIAR=false
      - NODE_ENV=${NODE_ENV:-production}
      # DEF-16: orígenes autorizados para CORS
      - CORS_ORIGINS=${CORS_ORIGINS:-https://localhost:3443}
      - JWT_SECRET=${JWT_SECRET:?Defina JWT_SECRET en .env (ver .env.example)}
      # DEF-18: clave de cifrado de datos bancarios (32 bytes en base64)
      - DATA_ENCRYPTION_KEY=${DATA_ENCRYPTION_KEY:?Defina DATA_ENCRYPTION_KEY en .env (ver .env.example)}
    # DEF-17: la API no publica su puerto HTTP; se accede solo por HTTPS a través de nginx (/api)
    # DEF-19: sistema de archivos de solo lectura, sin capacidades de Linux y sin escalar privilegios
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      atlas-migraciones:
        condition: service_completed_successfully
    networks:
      - atlas-network
    restart: unless-stopped

  atlas-frontend:
    build:
      context: ./FRONTEND
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "/api"
    container_name: atlas-frontend
    hostname: atlas-web
    # DEF-17: HTTP (solo redirige) y HTTPS
    ports:
      - "${PORT_FRONTEND:-3350}:8080"
      - "${PORT_FRONTEND_TLS:-3443}:8443"
    environment:
      - NGINX_PUERTO_HTTPS=${PORT_FRONTEND_TLS:-3443}
      - NGINX_DOMINIO=${DOMINIO:-localhost}
    volumes:
      - ./certs:/etc/nginx/certs:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - atlas-backend
    networks:
      - atlas-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  atlas-network:
    driver: bridge
    name: atlas-network
