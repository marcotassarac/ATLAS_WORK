# Plantilla de nginx (la imagen reemplaza ${NGINX_PUERTO_HTTPS} al iniciar).
# DEF-17: HTTPS obligatorio. HTTP solo redirige a HTTPS (NFR-SEG-1).

server {
    listen 8080;
    server_name _;
    server_tokens off;
    return 301 https://$host:${NGINX_PUERTO_HTTPS}$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # DEF-16: no informar la versión de nginx en cabeceras ni páginas de error
    server_tokens off;

    # DEF-17: TLS 1.2 y 1.3 únicamente (NFR-SEG-1), sin tickets de sesión reutilizables
    ssl_certificate /etc/nginx/certs/atlas.crt;
    ssl_certificate_key /etc/nginx/certs/atlas.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    # DEF-17: la API se publica en el mismo origen (/api) y solo por HTTPS.
    # El contenedor de la API ya no expone su puerto HTTP fuera de la red interna.
    location /api/ {
        proxy_pass http://atlas-backend:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 11m; # documentos de hasta 10 MB (RF-5.2) más el formulario
        proxy_read_timeout 60s;
    }

    # Configuración para SPA (Single Page Application)
    location / {
        include /etc/nginx/snippets/cabeceras_seguridad.conf;
        try_files $uri $uri/ /index.html;
    }

    # Recursos estáticos con huella en el nombre: caché larga
    location /assets/ {
        include /etc/nginx/snippets/cabeceras_seguridad.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;
}
